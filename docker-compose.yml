services:
  migrate:
    build:
      context: .
      target: prod
    command: alembic upgrade head
    env_file:
      - .env
      - .env.local
    environment:
      - SQL_DSN=postgresql+asyncpg://coffeeclaw:coffeeclaw@postgres:5432/coffeeclaw
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: prod
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.local
    environment:
      - SQL_DSN=postgresql+asyncpg://coffeeclaw:coffeeclaw@postgres:5432/coffeeclaw
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coffeeclaw
      POSTGRES_PASSWORD: coffeeclaw
      POSTGRES_DB: coffeeclaw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeeclaw"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
