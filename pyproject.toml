[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coffeeclaw"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres",
    "redis>=5.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
    "docker>=7.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv]
cache-dir = ".cache/uv"

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
cache_dir = ".cache/mypy"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"

[tool.hatch.build.targets.wheel]
packages = ["src"]
